# ENTORNO LOCAL DE PRÁCTICAS. NO PUBLICAR ESTE SERVICIO EN INTERNET.
# Requiere Docker Compose instalado; no usar esta configuración en producción.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_aula
    volumes:
      - datos_postgres:/var/lib/postgresql/data
  web:
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_aula
    volumes:
      - datos_odoo:/var/lib/odoo
      - ./addons:/mnt/extra-addons
volumes:
  datos_postgres:
  datos_odoo:
